name: MindVideo 每日自动签到

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00（GitHub Actions 用 UTC，且实际可能延迟几分钟）
    - cron: '0 1 * * *'
  workflow_dispatch:        # 允许在 Actions 页面手动点一次立即运行测试

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖 + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 执行签到
        env:
          MV_COOKIE: ${{ secrets.MV_COOKIE }}
          MV_EMAIL: ${{ secrets.MV_EMAIL }}
          MV_PASSWORD: ${{ secrets.MV_PASSWORD }}
          MV_TG_TOKEN: ${{ secrets.MV_TG_TOKEN }}
          MV_TG_CHAT: ${{ secrets.MV_TG_CHAT }}
        run: python mindvideo_checkin.py

      - name: 上传诊断文件（无论成功失败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic
          path: diag_*.png
          if-no-files-found: ignore
